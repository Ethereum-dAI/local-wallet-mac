name: CI
# push is scoped to main so PR branches don't double-run every job
# (pull_request already covers them).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-wallet-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-wallet-daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
  railgun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local-wallet-railgun
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      # The fork fixture only exists under `fork-sync`, so without this step ~900 lines of test
      # code would never be compiled by CI at all and would bitrot silently. Compiling it is
      # safe: the fixture itself is `#[ignore]`d AND needs network, an RPC key, anvil and Alto,
      # so `cargo test` below never runs it.
      - run: cargo clippy --workspace --all-targets --features fork-sync -- -D warnings
      - run: cargo test --workspace
  ffi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy -p wallet-ffi -- -D warnings
      - run: cargo test -p wallet-ffi
