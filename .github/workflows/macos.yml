name: macOS

# Expensive Swift/macOS suite. macOS runners cost ~10x Linux minutes, so this
# does NOT run on every push/PR (the cheap ubuntu Rust jobs in ci.yml cover
# those). It runs on published releases, version tags, and on-demand via the
# Actions "Run workflow" button.
#
# llama.cpp is NOT installed from Homebrew here. It is pinned by
# local-llm/LLAMA_CPP_PIN and provisioned by scripts/provision-llama.sh, so this
# job builds against the same bytes as every contributor. Because the full suite
# is release-gated, note that a pin problem is not caught per-PR -- run this
# workflow manually via workflow_dispatch when changing the pin or the vendored
# llama.cpp headers.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon (arm64); newer default Xcode/Swift (6.1+) than macos-14.
    # This is no longer a stopgap: the app's deployment target is macOS 15, so the runner has to
    # ship a macOS 15 SDK. (It originally worked around issue #41, a strict-concurrency error
    # under macos-14's Swift 6.0.3; that source fix has since landed.)
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode (packages require Swift 6+)
        # The default Xcode on the runner image can be Swift 5.10, but the Swift
        # packages declare swift-tools-version 6.0. Pick the highest-versioned
        # Xcode installed on the runner (image-agnostic).
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install build tools (cbindgen, xcodegen)
        # llama.cpp/ggml deliberately absent: they come from the pin, not brew.
        # Homebrew cannot install a specific llama.cpp version at all, which is
        # what made an unpinned `brew install llama.cpp` here a build-breaker.
        run: brew install cbindgen xcodegen

      - name: Cache the pinned llama.cpp download
        uses: actions/cache@v4
        with:
          # Only the downloaded asset is cached, not the assembled prefix: the
          # prefix is cheap to rebuild and staging it fresh keeps the integrity
          # and closure checks running on every job.
          path: .llama/cache
          key: llama-cpp-${{ hashFiles('local-llm/LLAMA_CPP_PIN') }}

      - name: Provision pinned llama.cpp
        # build-ffi.sh provisions too, and this is idempotent, so the call below
        # is a no-op. Doing it as its own step means a bad pin, a failed
        # checksum, a header/pin commit mismatch or an incomplete backend
        # closure reports here rather than being buried in the Rust build.
        run: |
          ./scripts/provision-llama.sh
          echo "--- staged prefix ---"
          ls -la .llama/current/lib
          echo "--- libllama dependencies ---"
          otool -L .llama/current/lib/libllama.dylib

      - name: Build wallet-ffi + stage bridge lib/headers
        run: ./scripts/build-ffi.sh

      - name: Build daemon binary (required by SpawnHelperTests)
        # SpawnHelperTests resolve local-wallet-daemon/target/debug/wallet-node
        # by default (and XCTSkip when it's absent), so build the debug profile.
        working-directory: local-wallet-daemon
        run: cargo build -p wallet-node

      - name: Test swift-bridge (WalletSignature)
        working-directory: swift-bridge
        run: swift test

      - name: Test local-llm (LocalLLM)
        # Model-backed tests self-skip when the GGUF is absent (guarded on
        # fileExists), so this runs without the multi-GB model download.
        working-directory: local-llm
        run: swift test

      - name: Test wallet-macos (app, tool layer, SpawnHelper)
        working-directory: wallet-macos
        run: swift test
