[package]
name = "edw-tui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rig-agent = "0.42.0"
rig-core = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
