[package]
name = "edw-tui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rig-agent = "0.42.0"
rig-core = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

# Skills (src/skills): manifests, folder hashes, plan encoding against pinned function signatures.
toml = "0.9"
sha2 = "0.10.9"
alloy-dyn-abi = "1.7.3"
alloy-json-abi = "1.7.3"

# INTERIM (src/interim): edw-core signs balance/transfer/swap until desktop-wallet ships
# those commands. The rev must equal edw::EDW_PINNED_REV (a test checks it); the alloy
# versions follow edw-core's own workspace so there is one copy of each.
edw-core = { git = "https://github.com/ethereum/desktop-wallet", rev = "038c9944c0efff46082a9d85fdc216fe5e6c738e" }
alloy-network = "2.3.0"
alloy-primitives = "1.6.1"
alloy-provider = "2.3.0"
alloy-rpc-types-eth = "2.3.0"
alloy-signer-local = "2.3.0"
alloy-sol-types = "1.6.1"

[dev-dependencies]
tempfile = "3.27.0"
alloy-node-bindings = "2.3.0"
portable-pty = "0.9.0"
vt100 = "0.16.2"
zeroize = "1"
