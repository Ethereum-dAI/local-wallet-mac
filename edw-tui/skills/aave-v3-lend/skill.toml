[[read_tool]]
name = "aave_markets"
run = "scripts/aave_markets.py"
description = "Aave v3's current supply and variable borrow APY for USDC, USDT, DAI and WETH (ETH) on the unlocked chain, read on chain, and what the sending profile holds, has supplied and owes of each."
schema = { type = "object", properties = {} }

[[read_tool]]
name = "aave_account"
run = "scripts/aave_account.py"
description = "The sending profile's Aave v3 account, read on chain: collateral, debt, how much more it can borrow (and how much keeping the health factor at 1.5), LTV, health factor, and each asset supplied (and whether it is collateral) or borrowed."
schema = { type = "object", properties = {} }

[[action]]
name = "aave_supply"
run = "scripts/aave_supply.py"
description = "Supply USDC, USDT, DAI, WETH or ETH to Aave v3 from the sending profile. A token is approved for exactly the amount, then supplied; ETH goes through Aave's WETH gateway. The user reviews it before anything is sent."
schema = { type = "object", required = ["token", "amount"], properties = { token = { type = "string", enum = ["USDC", "USDT", "DAI", "WETH", "ETH"] }, amount = { type = "string", description = "In whole tokens, e.g. 100 or 0.5." } } }
approves = ["pool"]

[[action]]
name = "aave_withdraw"
run = "scripts/aave_withdraw.py"
description = "Withdraw what the sending profile supplied to Aave v3, back to the profile: USDC, USDT, DAI, WETH, or ETH through the WETH gateway. amount is in whole tokens, or all. The user reviews it before anything is sent."
schema = { type = "object", required = ["token", "amount"], properties = { token = { type = "string", enum = ["USDC", "USDT", "DAI", "WETH", "ETH"] }, amount = { type = "string", description = "In whole tokens, or all." } } }
approves = ["gateway"]

[[action]]
name = "aave_borrow"
run = "scripts/aave_borrow.py"
description = "Borrow USDC, USDT, DAI, WETH or ETH from Aave v3 at the variable rate, against what the sending profile supplied. The review shows the health factor before and after. The user reviews it before anything is sent."
schema = { type = "object", required = ["token", "amount"], properties = { token = { type = "string", enum = ["USDC", "USDT", "DAI", "WETH", "ETH"] }, amount = { type = "string", description = "In whole tokens, e.g. 500 or 0.25." } } }
approves = ["gateway"]

[[action]]
name = "aave_repay"
run = "scripts/aave_repay.py"
description = "Repay what the sending profile borrowed from Aave v3 (variable rate): an amount in whole tokens, or all. A token is approved for exactly what is repaid; ETH is sent through the WETH gateway. The user reviews it before anything is sent."
schema = { type = "object", required = ["token", "amount"], properties = { token = { type = "string", enum = ["USDC", "USDT", "DAI", "WETH", "ETH"] }, amount = { type = "string", description = "In whole tokens, or all." } } }
approves = ["pool"]

[[action]]
name = "aave_collateral"
run = "scripts/aave_collateral.py"
description = "Turn using a supplied asset as collateral on or off for the sending profile on Aave v3 (ETH is the WETH reserve). The review shows the health factor before and after. The user reviews it before anything is sent."
schema = { type = "object", required = ["token", "use_as_collateral"], properties = { token = { type = "string", enum = ["USDC", "USDT", "DAI", "WETH", "ETH"] }, use_as_collateral = { type = "boolean" } } }
