version = "0.2.0"
requires = ["defi-data"]
# Everything this skill reads comes over the wallet's own RPC; it calls no HTTP host.
hosts = []

# Addresses: bgd-labs/aave-address-book (AaveV3Ethereum, AaveV3Sepolia), checked against Aave's
# PoolAddressesProvider by `cargo test --test skills_aave -- --ignored`.
[[contract]]
id = "pool"
label = "Aave Pool"
functions = [
  "function supply(address asset,uint256 amount,address onBehalfOf,uint16 referralCode)",
  "function withdraw(address asset,uint256 amount,address to) returns (uint256)",
  "function borrow(address asset,uint256 amount,uint256 interestRateMode,uint16 referralCode,address onBehalfOf)",
  "function repay(address asset,uint256 amount,uint256 interestRateMode,address onBehalfOf) returns (uint256)",
  "function setUserUseReserveAsCollateral(address asset,bool useAsCollateral)",
]
# The review shows these amounts in the asset's own units.
amounts = { supply = { amount = "asset" }, withdraw = { amount = "asset" }, borrow = { amount = "asset" }, repay = { amount = "asset" } }
address = { 1 = "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2", 11155111 = "0x6Ae43d3271ff6888e7Fc43Fd7321a503ff738951" }

# Moves ETH in and out of the WETH reserve. Aave v3.2 dropped the interest-rate-mode argument
# from borrowETH and repayETH; Sepolia's gateway is older and still takes it, so both forms are
# listed (each gateway rejects the other's).
[[contract]]
id = "gateway"
label = "Aave WETH Gateway"
functions = [
  "function depositETH(address pool,address onBehalfOf,uint16 referralCode) payable",
  "function withdrawETH(address pool,uint256 amount,address to)",
  "function borrowETH(address pool,uint256 amount,uint16 referralCode)",
  "function borrowETH(address pool,uint256 amount,uint256 interestRateMode,uint16 referralCode)",
  "function repayETH(address pool,uint256 amount,address onBehalfOf) payable",
  "function repayETH(address pool,uint256 amount,uint256 interestRateMode,address onBehalfOf) payable",
]
amounts = { withdrawETH = { amount = "weth" }, borrowETH = { amount = "weth" }, repayETH = { amount = "weth" } }
address = { 1 = "0xd01607c3C5eCABa394D8be377a08590149325722", 11155111 = "0x387d311e47e80b498169e6fb51d3193167d89F7D" }

# Every review shows the account as the simulation reads it before and after the plan.
[[review_read]]
label = "Aave account"
contract = "pool"
function = "function getUserAccountData(address user) view returns (uint256 collateral,uint256 debt,uint256 canBorrow,uint256 liquidationThreshold,uint256 ltv,uint256 healthFactor)"
args = ["$self"]
show = { collateral = "8 USD", debt = "8 USD", canBorrow = "8 USD", healthFactor = "18" }

