[workspace]
members = [
    "crates/wallet-node",
    "crates/wallet-bundler",
    "crates/wallet-chain",
    "crates/wallet-node-api",
    "crates/wallet-node-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Protocol crates (in-repo path deps — monorepo consolidation)
wallet-signature = { path = "../local-wallet-protocol/crates/signature" }
wallet-kernel    = { path = "../local-wallet-protocol/crates/kernel" }
wallet-addresses = { path = "../local-wallet-protocol/crates/wallet-addresses" }
wallet-userop-policy = { path = "../local-wallet-protocol/crates/userop-policy" }

# Copied verbatim from local-wallet-protocol monorepo [workspace.dependencies]
alloy-primitives = { version = "1.5", features = ["serde"] }
alloy-sol-types  = "1.5"
alloy            = "1.8"
helios-ethereum = { git = "https://github.com/a16z/helios", rev = "204c998a927348e1c000a664f08d5b37b1b0d924" }
helios-core     = { git = "https://github.com/a16z/helios", rev = "204c998a927348e1c000a664f08d5b37b1b0d924" }
async-trait     = "0.1"
sha2             = "0.10"
p256             = { version = "0.13", features = ["ecdsa"] }
hex-literal      = "0.4"
tokio            = { version = "1", features = ["full"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror        = "1"
anyhow           = "1"
rusqlite         = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
tracing-appender = "0.2"
hex              = "0.4"
zeroize          = "1"
ens-normalize    = "0.1.1"
