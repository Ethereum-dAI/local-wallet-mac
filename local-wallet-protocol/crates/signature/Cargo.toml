[package]
name    = "wallet-signature"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reusable Rust tooling for Kernel smart-account WebAuthn/P-256 signing flows."
readme = "README.md"
keywords = ["account-abstraction", "webauthn", "p256", "kernel", "ethereum"]
categories = ["cryptography::cryptocurrencies", "authentication"]

[dependencies]
alloy-primitives = { workspace = true }
alloy-sol-types  = { workspace = true }
wallet-addresses = { path = "../wallet-addresses" }
sha2             = { workspace = true }
p256             = { workspace = true }
k256             = { version = "0.13", features = ["ecdsa"] }
hex              = { workspace = true }
base64           = "0.22"

[dev-dependencies]
hex-literal = { workspace = true }
serde_json  = "1"
