# Isolated workspace so this crate is never captured by a sibling workspace.
[workspace]

[package]
name = "railgun-helper"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
# Cap Subsquid sync at a specific block so it matches an anvil fork (Subsquid indexes
# LIVE Sepolia; without the cap it returns commitments past the fork head that the fork
# contract doesn't have). Enables railgun's `testing` feature, which exposes
# SubsquidSyncer::with_latest_block. Used by the fork e2e; off for live deployments.
fork-sync = ["railgun/testing"]

[lib]
name = "railgun_helper"
path = "src/lib.rs"

[[bin]]
name = "railgun-helper"
path = "src/bin/railgun-helper.rs"

[[bin]]
name = "railgun-broadcaster"
path = "src/bin/railgun-broadcaster.rs"

[dependencies]
# Kohaku RAILGUN Rust SDK. NEVER enable the `js` feature (drags wasm-bindgen).
railgun = { git = "https://github.com/ethereum/kohaku.git", rev = "877026e1775a333c556c6fea54dc270009aac978", default-features = false }
# TxData ({to,data,value}) crosses the RPC boundary; name it directly. `alloy` feature
# gives the `From<TxData> for TransactionRequest` conversion. `js` stays off.
eip-1193-provider = { git = "https://github.com/ethereum/kohaku.git", rev = "877026e1775a333c556c6fea54dc270009aac978", default-features = false, features = ["alloy"] }

alloy = { version = "1.8", features = [
    "std", "providers", "network", "signer-local", "contract",
    "sol-types", "rpc-types", "provider-http", "reqwest", "transport-http",
] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
libc = "0.2"
subtle = "2"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Must match the rand major that `railgun` uses (0.9) so the `R: Rng` bound on
# RailgunProvider::build / ShieldBuilder::build and the SpendingKey/ViewingKey
# Distribution impls line up.
rand = "0.9"
rand_chacha = "0.9"

# BIP-39 mnemonic/seed + standard secp256k1 BIP-32 (broadcaster EOA). The RAILGUN
# account uses a CUSTOM HMAC-SHA512 walk (see derivation.rs), hence hmac/sha2 too.
bip39 = "2"
bip32 = "0.5"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
