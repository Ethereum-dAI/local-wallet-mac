name: LocalWallet
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "15.0"
packages:
  WalletBridge:
    path: swift-bridge
  WalletMacOS:
    path: wallet-macos
  LocalLLM:
    path: local-llm
targets:
  LocalWalletApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: wallet-macos/Sources/WalletMacOSApp
      - path: wallet-macos/App/Assets.xcassets
    resources:
      - path: wallet-macos/Sources/WalletMacOSApp/Resources
    preBuildScripts:
      - name: Build wallet-node
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          set -eu
          LW_CARGO_BIN="${CARGO:-${HOME}/.cargo/bin/cargo}"
          if [ ! -x "${LW_CARGO_BIN}" ]; then
            LW_CARGO_BIN="$(command -v cargo || true)"
          fi
          if [ -z "${LW_CARGO_BIN}" ] || [ ! -x "${LW_CARGO_BIN}" ]; then
            echo "error: Cargo was not found. Install Rust with rustup before building Local Wallet." >&2
            exit 1
          fi
          cd "${SRCROOT}/local-wallet-daemon"
          "${LW_CARGO_BIN}" build -p wallet-node --release
    info:
      path: wallet-macos/App/Info.plist
      properties:
        CFBundleDisplayName: Local Wallet
        CFBundleName: Local Wallet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.finance
        NSPrincipalClass: NSApplication
    settings:
      base:
        DEVELOPMENT_TEAM: MZ5U9N8DBS
        PRODUCT_BUNDLE_IDENTIFIER: ai.ethereum.localwallet.demo
        PRODUCT_NAME: Local Wallet
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: wallet-macos/App/LocalWallet.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: 15.0
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
    dependencies:
      - package: WalletBridge
        product: WalletSignature
      - package: LocalLLM
        product: LocalLLM
      - package: WalletMacOS
        product: SpawnHelper
      - package: WalletMacOS
        product: WalletToolLayer
schemes:
  LocalWalletApp:
    build:
      targets:
        LocalWalletApp: all
    run:
      config: Debug
      environmentVariables:
        LOCAL_WALLET_NODE_BIN: $(SRCROOT)/local-wallet-daemon/target/release/wallet-node
        WALLET_NODE_BIN: $(SRCROOT)/local-wallet-daemon/target/release/wallet-node
    archive:
      config: Release
