[workspace]
members = ["crates/ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Protocol crates (in-repo path deps, vendored monorepo checkout)
wallet-signature = { path = "../local-wallet-protocol/crates/signature" }
wallet-kernel    = { path = "../local-wallet-protocol/crates/kernel" }
wallet-addresses = { path = "../local-wallet-protocol/crates/wallet-addresses" }
wallet-userop-policy = { path = "../local-wallet-protocol/crates/userop-policy" }

# wallet-node-api from daemon (forces cbindgen materialization in build-ffi.sh).
wallet-node-api  = { path = "../local-wallet-daemon/crates/wallet-node-api" }

# Other deps used by wallet-ffi (subset of monorepo):
alloy-primitives = { version = "1.5", features = ["serde"] }
sha2             = "0.10"
zeroize          = "1"
hex-literal      = "0.4"
p256             = { version = "0.13", features = ["ecdsa"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
