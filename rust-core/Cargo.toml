[workspace]
members = ["crates/ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Protocol crates (git deps, rev pinned from Phase 1)
wallet-signature = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "ea28622aabcc4b0256d86fef8e0fee4d9cd37858" }
wallet-kernel    = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "ea28622aabcc4b0256d86fef8e0fee4d9cd37858" }
wallet-addresses = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "ea28622aabcc4b0256d86fef8e0fee4d9cd37858" }

# wallet-node-api from daemon (forces cbindgen materialization in build-ffi.sh).
wallet-node-api  = { git = "https://github.com/Ethereum-dAI/local-wallet-daemon.git", rev = "ce2d9812ee55f532fe58bb615273a82964353bb5" }

# Other deps used by wallet-ffi (subset of monorepo):
alloy-primitives = { version = "1.5", features = ["serde"] }
sha2             = "0.10"
zeroize          = "1"
hex-literal      = "0.4"
p256             = { version = "0.13", features = ["ecdsa"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
