[workspace]
members = ["crates/ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Protocol crates (git deps, rev pinned from Phase 1)
wallet-signature = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "ed7b87f1097799be503c07d9b9c01d846579f6fb" }
wallet-kernel    = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "ed7b87f1097799be503c07d9b9c01d846579f6fb" }
wallet-addresses = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "ed7b87f1097799be503c07d9b9c01d846579f6fb" }

# wallet-node-api from daemon (forces cbindgen materialization in build-ffi.sh).
wallet-node-api  = { git = "https://github.com/Ethereum-dAI/local-wallet-daemon.git", rev = "3cc56ea091a81f91e8a4dcecbda96bb461caf7f1" }

# Other deps used by wallet-ffi (subset of monorepo):
alloy-primitives = { version = "1.5", features = ["serde"] }
sha2             = "0.10"
zeroize          = "1"
hex-literal      = "0.4"
p256             = { version = "0.13", features = ["ecdsa"] }
