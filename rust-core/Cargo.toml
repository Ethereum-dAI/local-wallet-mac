[workspace]
members = ["crates/ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Protocol crates (git deps, rev pinned from Phase 1)
wallet-signature = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "221144d9b4ab95999c98c3fce40c8bc69b13a9e8" }
wallet-kernel    = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "221144d9b4ab95999c98c3fce40c8bc69b13a9e8" }
wallet-addresses = { git = "https://github.com/Ethereum-dAI/local-wallet-protocol.git", rev = "221144d9b4ab95999c98c3fce40c8bc69b13a9e8" }

# wallet-node-api from daemon (forces cbindgen materialization in build-ffi.sh).
wallet-node-api  = { git = "https://github.com/Ethereum-dAI/local-wallet-daemon.git", rev = "f33bfb48477ba253bba5238ac1dbe088ab6a8de7" }

# Other deps used by wallet-ffi (subset of monorepo):
alloy-primitives = { version = "1.5", features = ["serde"] }
sha2             = "0.10"
zeroize          = "1"
hex-literal      = "0.4"
p256             = { version = "0.13", features = ["ecdsa"] }
