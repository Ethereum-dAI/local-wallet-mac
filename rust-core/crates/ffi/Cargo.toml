[package]
name    = "wallet-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Internal C ABI bridge for the local wallet Swift package."
publish = false

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
wallet-signature  = { workspace = true }
wallet-kernel     = { workspace = true }
wallet-userop-policy = { workspace = true }
wallet-node-api   = { workspace = true }
alloy-primitives  = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
sha2              = { workspace = true }
secp256k1         = { version = "0.30", features = ["rand"] }
zeroize           = { workspace = true }

[dev-dependencies]
hex-literal = { workspace = true }
p256        = { workspace = true }
