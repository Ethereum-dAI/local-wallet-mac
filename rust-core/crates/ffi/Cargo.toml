[package]
name    = "wallet-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Internal C ABI bridge for the local wallet Swift package."
publish = false

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
wallet-signature  = { path = "../signature" }
wallet-kernel     = { path = "../kernel" }
alloy-primitives  = { workspace = true }
sha2              = { workspace = true }

[dev-dependencies]
hex-literal = { workspace = true }
p256        = { workspace = true }
