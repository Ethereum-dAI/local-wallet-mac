[package]
name    = "wallet-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build   = "build.rs"

[[bin]]
name = "wallet-node"
path = "src/main.rs"

[dependencies]
wallet-chain = { path = "../wallet-chain" }
wallet-bundler = { path = "../wallet-bundler" }
wallet-node-api = { path = "../wallet-node-api" }
wallet-node-store = { path = "../wallet-node-store" }
clap            = { version = "4", features = ["derive"] }
serde           = { workspace = true }
serde_json      = { workspace = true }
toml            = "0.8"
dirs            = "5"
rand            = "0.8"
base64          = "0.22"
subtle          = "2"
thiserror       = { workspace = true }
async-trait     = { workspace = true }
tokio           = { workspace = true }
hyper           = { version = "1", features = ["server", "http1"] }
hyper-util      = { version = "0.1", features = ["tokio"] }
http-body-util  = "0.1"
bytes           = "1"
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
file-rotate     = "0.7"
nix             = { version = "0.29", features = ["event", "fs"] }
libc            = "0.2"
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
hex             = { workspace = true }
secp256k1       = { version = "0.30", features = ["rand", "recovery"] }
zeroize         = "1"

[dev-dependencies]
rusqlite = { workspace = true }
wallet-kernel = { path = "../kernel" }
wallet-signature = { path = "../signature" }
p256 = { workspace = true }
sha2 = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
